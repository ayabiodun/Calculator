<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/2190736b83.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./src/style.css">
    <script type="module" src="./dist/main.js" defer></script>
</head>
<body>
    <section class="calculator">
        <input type="text" id="display" readonly>

        <div id="all-buttons">
            <button class="clear">AC</button>
            <button class="back"><i class="fa-solid fa-arrow-left"></i></button>
            <button class="operators">/</button>
            <button class="operators">*</button>
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operators">-</button>
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operators">+</button>
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="equals">=</button>
            <button class="number zero">0</button>
            <button class="decimal">.</button>
        </div>
    </section>
</body>
</html>
